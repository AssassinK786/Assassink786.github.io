name: Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

# Cancel older runs on the same branch so they don't race each other
concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Timezone fallback: reads the secret; defaults to Asia/Kolkata if unset
    env:
      TZ: ${{ secrets.USER_TIMEZONE || 'Asia/Kolkata' }}

    steps:

      # ── Achievements ──────────────────────────────────────────────
      - name: achievements
        uses: lowlighter/metrics@v3.34
        with:
          filename: .metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AssassinK786
          base: achievements
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      # ── Header ────────────────────────────────────────────────────
      - name: header
        uses: lowlighter/metrics@v3.34
        with:
          filename: .metrics/header.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AssassinK786
          template: classic
          base: header
          base_hireable: yes
          config_timezone: ${{ env.TZ }}

      # ── Lines of code ─────────────────────────────────────────────
      - name: lines
        uses: lowlighter/metrics@v3.34
        with:
          filename: .metrics/lines-of-code.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AssassinK786
          base: repositories
          plugin_lines: yes

      # ── Activity + Community ──────────────────────────────────────
      - name: acti_comm
        uses: lowlighter/metrics@v3.34
        with:
          filename: .metrics/acti_comm.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AssassinK786
          template: classic
          base: activity, community
          config_timezone: ${{ env.TZ }}

      # ── ISO Calendar ──────────────────────────────────────────────
      - name: iso_calendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: .metrics/iso_calender.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AssassinK786
          template: classic
          base: ""
          config_timezone: ${{ env.TZ }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # ── Issues / PRs / Languages ──────────────────────────────────
      - name: issue_pr_lang
        uses: lowlighter/metrics@v3.34
        with:
          filename: .metrics/issue_pr_lang.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AssassinK786
          template: classic
          base: ""
          config_timezone: ${{ env.TZ }}
          plugin_followup: yes
          plugin_languages: yes

      # ── Repositories ──────────────────────────────────────────────
      - name: repositories
        uses: lowlighter/metrics@v3.34
        with:
          filename: .metrics/repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AssassinK786
          template: classic
          base: repositories
          config_timezone: ${{ env.TZ }}
